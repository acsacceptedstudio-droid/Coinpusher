<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>遊戲帳號登入系統</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #1e1e1e; padding: 30px; border-radius: 10px; width: 100%; max-width: 380px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    h2 { margin-bottom: 20px; text-align: center; color: #4caf50; }
    input { width: 100%; padding: 10px; margin: 8px 0; background: #2d2d2d; border: 1px solid #444; border-radius: 5px; color: #fff; }
    button { width: 100%; padding: 10px; margin-top: 10px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    .btn-primary { background: #4caf50; color: #fff; }
    .btn-secondary { background: #333; color: #ccc; border: 1px solid #555; }
    .btn-google { background: #4285f4; color: #fff; }
    .hidden { display: none; }
    .info { background: #2d2d2d; padding: 15px; border-radius: 5px; margin-top: 15px; line-height: 1.8; }
  </style>
</head>
<body>

  <!-- 登入卡片 -->
  <div class="card" id="auth-box">
    <h2>遊戲會員登入</h2>
    <input type="email" id="email" placeholder="電子郵件" />
    <input type="password" id="password" placeholder="密碼 (至少6碼)" />
    
    <button class="btn-primary" id="btn-login">Email 登入</button>
    <button class="btn-secondary" id="btn-register">註冊帳號</button>
    <button class="btn-google" id="btn-google">使用 Google 帳號登入</button>
  </div>

  <!-- 玩家資料卡片 -->
  <div class="card hidden" id="dashboard-box">
    <h2>玩家資料庫資訊</h2>
    <div class="info" id="user-info">讀取中...</div>
    <button class="btn-secondary" id="btn-logout">登出</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword,
      GoogleAuthProvider,
      signInWithPopup,
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // 1. 替換為你的 Firebase Config
    const firebaseConfig = {
       apiKey: "AIzaSyDcYOaIvDa37VseSNYaf2VpWC2Wca6DAV8",
       authDomain: "loginsystem-76570.firebaseapp.com",
       projectId: "loginsystem-76570",
       storageBucket: "loginsystem-76570.firebasestorage.app",
       messagingSenderId: "168963713565",
       appId: "1:168963713565:web:1e2768cafac1b1e0a134f4",
       measurementId: "G-SCNLSC394N"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();
    const FASTAPI_URL = "http://127.0.0.1:8000";

    const authBox = document.getElementById('auth-box');
    const dashboardBox = document.getElementById('dashboard-box');
    const userInfo = document.getElementById('user-info');

    // 2. 將 Firebase Token 傳送給 FastAPI
    async function syncWithBackend(user) {
      const idToken = await user.getIdToken();
      
      try {
        const res = await fetch(`${FASTAPI_URL}/api/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${idToken}`
          }
        });

        const data = await res.json();
        if (res.ok) {
          authBox.classList.add('hidden');
          dashboardBox.classList.remove('hidden');
          const p = data.player;
          userInfo.innerHTML = `
            <p><strong>Firebase UID:</strong><br>${p.firebase_uid}</p>
            <p><strong>Email:</strong> ${p.email}</p>
            <p><strong>角色暱稱:</strong> ${p.username}</p>
            <p><strong>等級:</strong> Lv.${p.level}</p>
            <p><strong>金幣:</strong> ${p.gold}</p>
          `;
        } else {
          alert("後端驗證失敗: " + data.detail);
        }
      } catch (err) {
        alert("無法連線至自建 FastAPI 伺服器！");
        console.error(err);
      }
    }

    // Email 登入
    document.getElementById('btn-login').addEventListener('click', async () => {
      const e = document.getElementById('email').value.trim();
      const p = document.getElementById('password').value;
      try {
        const res = await signInWithEmailAndPassword(auth, e, p);
        await syncWithBackend(res.user);
      } catch (err) { alert("登入失敗: " + err.message); }
    });

    // Email 註冊
    document.getElementById('btn-register').addEventListener('click', async () => {
      const e = document.getElementById('email').value;
      const p = document.getElementById('password').value;
      try {
        const res = await createUserWithEmailAndPassword(auth, e, p);
        alert("註冊成功！自動進行同步...");
        await syncWithBackend(res.user);
      } catch (err) { alert("註冊失敗: " + err.message); }
    });

    // Google 登入
    document.getElementById('btn-google').addEventListener('click', async () => {
      try {
        const res = await signInWithPopup(auth, googleProvider);
        await syncWithBackend(res.user);
      } catch (err) { alert("Google 登入失敗: " + err.message); }
    });

    // 登出
    document.getElementById('btn-logout').addEventListener('click', async () => {
      await signOut(auth);
      authBox.classList.remove('hidden');
      dashboardBox.classList.add('hidden');
    });
  </script>
</body>
</html>
